# Permanently disable the STM32G431 BOOT0 pin on CanableDevBoard FDCAN
# (Candlelight 2.5).  Equivalent to ElmueSoft Firmware Programmer's
# "Disable pin Boot0" button / ELM_ReqSetPinStatus(PINOP_Disable, PINID_BOOT0).
#
# References:
#   - Elmue: https://netcult.ch/elmue/CANable%20Firmware%20Update/#Firmware_Updater
#   - ST RM0440 (docs/datasheets/rm0440-...pdf):
#       Table 5 (Boot modes), Section 2.6; option byte organization p.111-112;
#       Option byte loading p.119 ("Setting OBL_LAUNCH generates a reset so the
#       option byte loading is performed under system reset").
#
# Problem: PB8 is both FDCAN1_RX and BOOT0.  With default option bytes
# nSWBOOT0=1, a high CAN_RX level at power-on sends the board to the STM32
# system bootloader (USB 0483:df11 DFU) instead of the Candlelight app.
#
# Fix: nSWBOOT0=0 (BOOT0 taken from option bit), nBOOT0=1 (boot main flash),
#      nBOOT1=1.  FLASH_OPTR goes from 0xFFEFFCAA -> 0xFBEFFCAA.
#      BOR_LEV=4 and RDP=0xAA are preserved.
#
# NOTE: Both FLASH and OPTION BYTE unlock sequences are required before
# setting OBL_LAUNCH; otherwise the reload is silently ignored.  Successful
# reload makes the target re-enumerate as the Candlelight app immediately.
#
# To re-enter DFU later, use the Elmue firmware's "Enter DFU mode" command;
# it re-enables the BOOT0 pin first and then asks for a cable reconnect.
#
# Usage:
#   openocd -f interface/stlink.cfg -f target/stm32g4x.cfg \
#           -f scripts/fix_boot0_swd.cfg

init
reset halt
echo "BEFORE: OPTR=0x[mrw 0x40022020] CR=0x[mrw 0x40022014]"

# Unlock FLASH then option-byte registers (STM32G4 keys)
mww 0x40022008 0x45670123
mww 0x40022008 0xCDEF89AB
mww 0x4002200C 0x08192A3B
mww 0x4002200C 0x4C5D6E7F

# Program new OPTR: only nSWBOOT0 (bit 26) cleared
mww 0x40022020 0xFBEFFCAA
# FLASH_CR_OPTSTRT (bit 17): commit option bytes to flash
mww 0x40022014 0x00020000

# Wait for FLASH_SR.BSY (bit 16)
set tries 0
set sr [mrw 0x40022010]
while {($sr & 0x00010000) != 0 && $tries < 200} {
    incr tries
    set sr [mrw 0x40022010]
}
echo "PROGRAMMED: OB0=0x[mrw 0x1FFF7800] nOB0=0x[mrw 0x1FFF7804] tries=$tries"

# Re-lock FLASH and option bytes
mww 0x40022014 0xC0000000

# Force option byte loader to reload the new values (generates a system reset)
# Both unlock sequences are needed again here, otherwise OBL_LAUNCH is ignored.
mww 0x40022008 0x45670123
mww 0x40022008 0xCDEF89AB
mww 0x4002200C 0x08192A3B
mww 0x4002200C 0x4C5D6E7F
mww 0x40022014 0x08000000
echo "OBL_LAUNCH issued: target resets and boots from main flash"
shutdown
